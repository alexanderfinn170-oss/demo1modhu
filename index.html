<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Pure Honey</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1a1a1a,#2c3e50);
  color:#fff;
}

/* ===== SLIDER HEADER ===== */
.slider{
  position:relative;
  width:100%;
  height:380px;
  overflow:hidden;
}
.slide{
  position:absolute;
  width:100%;
  height:100%;
  opacity:0;
  transition:opacity 1s ease-in-out;
}
.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.active{opacity:1;}

/* ===== TITLE ===== */
.section-title{
  text-align:center;
  font-size:34px;
  margin:40px 0 20px;
  font-weight:bold;
  color:#ffcc00;
}

/* ===== VIDEO ===== */
.video-section{
  text-align:center;
  padding:30px;
}
.video-section iframe{
  width:100%;
  max-width:850px;
  height:450px;
  border-radius:20px;
}

/* ===== GALLERY ===== */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
  padding:20px;
}
.card{
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  padding:15px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,.5);
  transition:0.3s;
}
.card:hover{transform:scale(1.05);}
.card img{
  width:100%;
  border-radius:15px;
  margin-bottom:15px;
}
.card ul{
  list-style:none;
  padding:0;
  text-align:left;
}
.card ul li{
  margin-bottom:8px;
  padding-left:22px;
  position:relative;
}
.card ul li::before{
  content:"✔";
  position:absolute;
  left:0;
  color:#00ff00;
}

/* ===== MOVING BUTTON ===== */
.order-btn{
  display:inline-block;
  margin-top:12px;
  padding:12px 30px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  color:#fff;
  background:linear-gradient(45deg,#ff8c00,#ff0000);
  animation:moveBtn 1.5s infinite;
}
@keyframes moveBtn{
  0%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
  100%{transform:translateY(0);}
}

/* ===== ORDER FORM ===== */
.order-box{
  background:#111;
  margin:40px 20px;
  padding:30px;
  border-radius:20px;
}
.order-box h2{
  text-align:center;
  margin-bottom:20px;
}
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:none;
}
.quantity-box{
  display:flex;
  justify-content:center;
  gap:15px;
  margin:15px 0;
}
.quantity-box button{
  width:40px;
  height:40px;
  font-size:20px;
}
.submit-btn{
  width:100%;
  padding:15px;
  background:#00cc44;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* SUCCESS MESSAGE */
.success-overlay{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#d4edda;
  color:#155724;
  padding:20px 30px;
  border-radius:10px;
  display:none;
}

/* FLOAT BUTTONS */
.float-buttons{
  position:fixed;
  bottom:20px;
  right:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}
.float-buttons a{
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
}
.float-buttons a.whatsapp{background:#25d366;}
.float-buttons a.messenger{background:#0084ff;}
.float-buttons img{width:25px;}

/* ===== FOOTER ===== */
.footer{
  background:#111;
  text-align:center;
  padding:25px 15px;
  font-size:14px;
  color:#ccc;
}
.footer a{
  color:#00ff00;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>
<body>

<!-- ===== HEADER SLIDER ===== -->
<div class="slider">
  <div class="slide active"><img src="IMAGE1.jpg"></div>
  <div class="slide"><img src="IMAGE2.jpg"></div>
  <div class="slide"><img src="IMAGE3.jpg"></div>
  <div class="slide"><img src="IMAGE4.jpg"></div>
  <div class="slide"><img src="IMAGE5.jpg"></div>
</div>

<h2 class="section-title">🍯 ১০০% বিশুদ্ধ প্রাকৃতিক মধু</h2>

<!-- ===== YOUTUBE VIDEO ===== -->
<div class="video-section">
<iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" allowfullscreen></iframe>
</div>

<!-- ===== GALLERY (৫টি কার্ড) ===== -->
<div class="gallery">
<!-- একই কার্ডগুলো আগের মতো এখানে থাকবে -->
</div>

<!-- ===== ORDER FORM ===== -->
<div class="order-box" id="order">
<h2>অর্ডার ফর্ম</h2>
<form id="orderForm">
<input type="text" placeholder="নাম" required>
<input type="tel" placeholder="মোবাইল" required>
<input type="text" placeholder="ঠিকানা" required>

<div class="quantity-box">
<button type="button" onclick="changeQty(-1)">-</button>
<span id="qty">1</span>
<button type="button" onclick="changeQty(1)">+</button>
</div>

<div>মোট মূল্য: ৳ <span id="total">1200</span></div>

<button type="submit" class="submit-btn">অর্ডার কনফার্ম করুন</button>
</form>
</div>

<div class="success-overlay" id="successMsg">
✅ ধন্যবাদ! আপনার অর্ডার সাবমিট হয়েছে।
</div>

<!-- ===== FOOTER WITH YOUR WEBSITE LINK ===== -->
<div class="footer">
<p>© 2026 Your Company | All Rights Reserved</p>
<p>Design By <a href="https://yourwebsite.com" target="_blank">GreenLine IT</a></p>
</div>

<!-- FLOATING CHAT BUTTONS -->
<div class="float-buttons">
<a href="YOUR_WHATSAPP_LINK" class="whatsapp">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>
<a href="YOUR_MESSENGER_LINK" class="messenger">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Facebook_Messenger_4_Logo.svg">
</a>
</div>

<script>
let slides=document.querySelectorAll('.slide');
let index=0;
setInterval(()=>{
  slides[index].classList.remove('active');
  index=(index+1)%slides.length;
  slides[index].classList.add('active');
},1000);

let price=1200;
let qty=1;
function changeQty(change){
  qty+=change;
  if(qty<1) qty=1;
  document.getElementById("qty").innerText=qty;
  document.getElementById("total").innerText=price*qty;
}
</script>

</body>
</html>
